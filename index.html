<!doctype html>
<html lang="en">
<head>

  <title>Notes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main id="note"></main>
  <script src="vendor/marked.min.js"></script>
  <script src="notes.js"></script>
  <script src="viewer.js"></script>

</html>
